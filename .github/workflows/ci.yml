name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # the tests, the jar, sources and javadoc on the oldest supported Java and the current LTS versions
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify

  # the tables and shortcuts generated from the C# sources are up to date
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: romanti3172/z3l.FastHtmlParser
          path: z3l.FastHtmlParser
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: java tools/Gen.java z3l.FastHtmlParser/src/z3l.FastHtmlParser
      - run: git diff --exit-code -- src
